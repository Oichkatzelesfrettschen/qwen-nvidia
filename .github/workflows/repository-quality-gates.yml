name: repository quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clone-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python3 -m venv /tmp/qwen-quality-gates
          /tmp/qwen-quality-gates/bin/pip install ruff==0.14.11

      - name: Run clone-local gates
        env:
          PATH: /tmp/qwen-quality-gates/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          QWEN_GATE_HOST_ROLE: runner
        run: scripts/repository-quality-gates.sh
